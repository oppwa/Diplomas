<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificación de diplomas – UAC</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f4f6fa;margin:0;color:#222}
header{background:#1a3a6b;color:#fff;padding:14px 20px;font-size:18px}
main{max-width:520px;margin:24px auto;padding:0 12px}
.card{background:#fff;border:1px solid #d5dbe6;border-radius:10px;padding:16px;margin-top:14px}
input{width:70%;padding:9px;border:1px solid #d5dbe6;border-radius:6px;text-transform:uppercase}
button{background:#1a3a6b;color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
.ok{border:2px solid #2e9d57;background:#e8f6ec}.bad{border:2px solid #c33;background:#fdecec}.wait{border:2px solid #d89a00;background:#fff7e0}
dt{font-size:12px;color:#666;margin-top:8px}dd{margin:0;font-weight:600}h2{margin:0 0 6px}
</style></head><body>
<header>Universidad Andina del Cusco – Verificación de diplomas</header>
<main>
 <div class="card"><b>Código de verificación</b><br><br><input id="cod" placeholder="Ej. TPMXWUX"> <button id="bV">Verificar</button></div>
 <div id="res"></div>
</main>
<script>
const UN={salud:["Decano","Ciencias de la Salud"],derecho:["Decano","Derecho y Ciencia Política"],economicas:["Decano","Ciencias Económicas, Administrativas y Contables"],ingenieria:["Decano","Ingeniería y Arquitectura"],humanidades:["Decano","Ciencias y Humanidades"],posgrado:["Directora","Escuela de Posgrado"]};
// Registros fijos de ejemplo: los ve cualquier persona que escanee el QR o escriba el código (en cualquier navegador).
const REGISTROS={
 GQ69K4N:{code:"GQ69K4N",nombre:"JEAN POOL JOHAN MURIEL QUISPE",grado:"BACHILLER EN PSICOLOGÍA",tipo:"Bachiller",ndip:"UAC0390039137",resol:"CU-4138-2026-GT/SG-UAC",fres:"26 de octubre del 2026",emision:"Original",fecha:"2026-10-26",unidad:"salud",firmas:3}
};
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function get(c){
 if(REGISTROS[c])return REGISTROS[c];
 try{return (JSON.parse(localStorage.getItem("diplomas")||"{}"))[c]||null;}catch{return null;} // modo demo: solo en el mismo navegador del panel
}
async function verificar(c){c=(c||"").toUpperCase().trim();if(!c)return;$("cod").value=c;
 const r=await get(c).catch(()=>null);
 if(!r||!r.nombre){$("res").innerHTML=`<div class="card bad"><h2>✘ Código no encontrado</h2>No existe un diploma registrado con el código ${esc(c)}.</div>`;return;}
 const u=UN[r.unidad]||["Decano",""],n=+r.firmas||0,f=["Rector","Secretaria General",u[0]+(u[1]?" – "+u[1]:"")].slice(0,n);
 const comp=n>=3;
 $("res").innerHTML=`<div class="card ${comp?"ok":"wait"}"><h2>${comp?"✔ Documento auténtico":"⏳ Diploma registrado, firmas digitales en proceso"}</h2><dl>
 <dt>Titular</dt><dd>${esc(r.nombre)}</dd><dt>Grado / título</dt><dd>${esc(r.grado||r.tipo)}</dd><dt>N° de diploma</dt><dd>${esc(r.ndip||"-")}</dd>
 <dt>Resolución</dt><dd>${esc(r.resol||"-")} (${esc(r.fres||"-")})</dd><dt>Tipo de emisión</dt><dd>${esc(r.emision||"-")}</dd><dt>Fecha de emisión</dt><dd>${esc(r.fecha)}</dd>
 <dt>Firmado digitalmente por</dt><dd>${f.length?f.map(esc).join("<br>"):"—"}</dd><dt>Código</dt><dd>${esc(c)}</dd></dl></div>`;}
$("bV").onclick=()=>{location.hash="v="+$("cod").value.trim();};
addEventListener("hashchange",()=>{const m=location.hash.match(/^#v=(\w+)/);if(m)verificar(m[1]);});
{const m=location.hash.match(/^#v=(\w+)/);if(m)verificar(m[1]);}
</script></body></html>
